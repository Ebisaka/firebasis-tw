[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firelaw-api"
version = "0.1.0"
description = "Local API for Taiwan central fire-law citation lookup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
semantic = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.scripts]
firelaw-api = "firelaw_api.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firelaw_api = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
